server.port=${PORT:8080}
spring.application.name=sentiment-api

# Database Configuration (Intelligent H2 Fallback)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:sentimentdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.h2.console.enabled=true

# Advanced Data Processing (High Performance Inserts)
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ML Service Configuration (Docker Support)
ml.service.base-url=${ML_SERVICE_BASE_URL:http://localhost:8000}

server.port=${PORT:8080}
server.address=0.0.0.0

