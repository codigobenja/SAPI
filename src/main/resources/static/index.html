<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SentimentAI | Dashboard</title>

    <!-- Bootstrap / Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --glass-bg: rgba(255, 255, 255, 0.95);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 10% 20%, rgb(239, 246, 255) 0%, rgb(219, 228, 241) 100.2%);
            min-height: 100vh;
        }

        .navbar-brand {
            font-weight: 700;
            color: #4e54c8 !important;
        }

        .main-card {
            border: none;
            border-radius: 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
        }

        .btn-analyze {
            background: var(--primary-gradient);
            border: none;
            color: white;
            font-weight: 600;
            padding: 12px;
        }

        .btn-analyze:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(118, 75, 162, 0.4);
        }

        .sentiment-badge {
            font-size: 1.1rem;
            padding: 10px 25px;
            border-radius: 50px;
        }

        .upload-area {
            border: 2px dashed #dee2e6;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            background: #fafafa;
        }

        .progress {
            height: 10px;
            border-radius: 10px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-light bg-white shadow-sm mb-4">
    <div class="container">
        <span class="navbar-brand">
            <i class="bi bi-cpu-fill me-2"></i>SentimentAI
        </span>
    </div>
</nav>

<div class="container">

    <!-- TABS -->
    <ul class="nav nav-pills justify-content-center mb-4">
        <li class="nav-item">
            <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tab-individual">
                <i class="bi bi-chat-left-text me-1"></i> Análisis Individual
            </button>
        </li>
        <li class="nav-item">
            <button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-csv">
                <i class="bi bi-file-earmark-spreadsheet me-1"></i> Carga CSV
            </button>
        </li>
        <li class="nav-item">
            <button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-stats">
                <i class="bi bi-bar-chart-line me-1"></i> Estadísticas
            </button>
        </li>
    </ul>

    <div class="tab-content">

        <!-- TAB 1: ANALISIS INDIVIDUAL -->
        <div class="tab-pane fade show active" id="tab-individual">
            <div class="row justify-content-center">
                <div class="col-lg-6">
                    <div class="card main-card p-4">
                        <h4 class="fw-bold mb-3">Análisis Individual</h4>

                        <textarea id="inputText" class="form-control mb-3"
                                  rows="4" placeholder="Escribe un comentario..."></textarea>

                        <button class="btn btn-analyze w-100" onclick="analyzeText()">
                            <span id="btnText">Analizar Sentimiento</span>
                            <span class="spinner-border spinner-border-sm ms-2 d-none" id="loader"></span>
                        </button>
                    </div>
                </div>

                <div class="col-lg-5 mt-4 mt-lg-0">
                    <div class="card main-card p-4 hidden" id="resultCard">
                        <h4 class="fw-bold">Resultado</h4>

                        <div class="text-center py-4">
                            <div id="sentimentIcon" class="mb-2"></div>
                            <span id="sentimentLabel" class="badge sentiment-badge"></span>
                            <h3 id="confidenceText" class="fw-bold mt-2">0%</h3>
                        </div>

                        <div class="progress">
                            <div id="progressBar" class="progress-bar"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- TAB 2: CSV -->
        <div class="tab-pane fade" id="tab-csv">
            <div class="row justify-content-center">
                <div class="col-lg-6">
                    <div class="card main-card p-4">
                        <h4 class="fw-bold mb-3">Carga Masiva CSV</h4>

                        <div class="upload-area mb-3">
                            <i class="bi bi-cloud-arrow-up fs-1 text-primary"></i>
                            <input type="file" class="form-control mt-3" accept=".csv">
                            <p class="small text-muted mt-2">
                                El archivo debe tener una columna <b>text</b>
                            </p>
                        </div>

                        <button class="btn btn-analyze w-100" onclick="alert('Endpoint batch pendiente')">
                            Procesar Archivo
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- TAB 3: STATS -->
        <div class="tab-pane fade" id="tab-stats">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card main-card p-4">
                        <h4 class="fw-bold mb-4">Estadísticas Generales</h4>

                        <div class="row text-center">
                            <div class="col">
                                <h1 class="text-success">65%</h1>
                                <p>Positivos</p>
                            </div>
                            <div class="col">
                                <h1 class="text-danger">35%</h1>
                                <p>Negativos</p>
                            </div>
                        </div>

                        <p class="text-muted small mt-3">
                            Datos simulados. Se alimentarán desde la base de datos.
                        </p>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    async function analyzeText() {
        const text = document.getElementById("inputText").value;
        if (!text || text.length < 5) {
            alert("El texto debe tener al menos 5 caracteres");
            return;
        }

        document.getElementById("loader").classList.remove("d-none");
        document.getElementById("btnText").innerText = "Procesando...";

        // 🔗 Backend real:
        // const response = await fetch('/sentiment', { ... })

        setTimeout(() => {
            showResult("Positivo", 0.87);
            document.getElementById("loader").classList.add("d-none");
            document.getElementById("btnText").innerText = "Analizar Sentimiento";
        }, 1200);
    }

    function showResult(sentiment, score) {
        const card = document.getElementById("resultCard");
        const badge = document.getElementById("sentimentLabel");
        const bar = document.getElementById("progressBar");
        const icon = document.getElementById("sentimentIcon");

        const percent = (score * 100).toFixed(1);

        card.classList.remove("hidden");
        badge.innerText = sentiment;
        badge.className = "badge sentiment-badge " +
            (sentiment === "Positivo" ? "bg-success" : "bg-danger");

        document.getElementById("confidenceText").innerText = percent + "%";
        bar.style.width = percent + "%";
        bar.className = "progress-bar " +
            (sentiment === "Positivo" ? "bg-success" : "bg-danger");

        icon.innerHTML = `<i class="bi ${sentiment === 'Positivo' ? 'bi-emoji-smile' : 'bi-emoji-frown'}
                          display-1 ${sentiment === 'Positivo' ? 'text-success' : 'text-danger'}"></i>`;
    }
</script>

</body>
</html>
